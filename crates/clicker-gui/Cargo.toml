[package]
name = "clicker-gui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "clicker_gui"
path = "src/lib.rs"

[[bin]]
name = "clicker-gui"
path = "src/main.rs"

[dependencies]

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader"] }
