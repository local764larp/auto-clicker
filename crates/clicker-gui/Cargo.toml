[package]
name = "clicker-gui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "clicker_gui"
path = "src/lib.rs"

[[bin]]
name = "clicker-gui"
path = "src/main.rs"

[dependencies]
clicker-core = { version = "0.1.0", path = "../clicker-core" }
windows-numerics = "0.3"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_DirectComposition", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Imaging", "Win32_Graphics_DirectWrite", "Win32_UI_Input", "Win32_System_Threading"] }
